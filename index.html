<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리가족 다카마쓰 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 위에 경로 약도, 그 아래 일차 탭 + 시간표. 보조 탭은 온천/식당/교통·비용/확인사항 */
:root{
  --bg:#F4F6F4;--surface:#FFFFFF;--surface2:#E9EFEC;--ink:#17231F;--muted:#58675F;--line:#D5DDD8;
  --accent:#1F6F5C;--accent-ink:#FFFFFF;--sea:#D4E7EA;--land:#E1E8DF;--landline:#B8C5BA;
  --red:#C0392B;--warn:#8F5600;--warn-bg:#FFF1D6;--ok:#2C7A3F;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613;--surface:#17211D;--surface2:#1F2D27;--ink:#E5EEE9;--muted:#98A8A0;--line:#2C3C35;
  --accent:#5CC4A6;--accent-ink:#06241B;--sea:#15303A;--land:#25362D;--landline:#3D5448;
  --red:#EE7B6D;--warn:#F0B35A;--warn-bg:#33270F;--ok:#6BC283;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613;--surface:#17211D;--surface2:#1F2D27;--ink:#E5EEE9;--muted:#98A8A0;--line:#2C3C35;
  --accent:#5CC4A6;--accent-ink:#06241B;--sea:#15303A;--land:#25362D;--landline:#3D5448;
  --red:#EE7B6D;--warn:#F0B35A;--warn-bg:#33270F;--ok:#6BC283;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(22px,5vw,30px);font-weight:900;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
h2{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700;text-transform:uppercase}
.map{width:100%;height:auto;display:block;background:var(--sea);border-radius:10px}
.map .land{fill:var(--land);stroke:var(--landline);stroke-width:1}
.map .rt{fill:none;stroke:var(--red);stroke-width:2.2;stroke-dasharray:6 4}
.map .pt circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.map .pt text{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.map .pt .n{fill:var(--accent-ink);stroke:none;font-family:var(--mono);font-size:10px;text-anchor:middle}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin:6px 0 2px}
.dayhead h3{margin:0;font-size:20px;font-weight:900}
.pill{display:inline-block;background:var(--surface2);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted);font-weight:700}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{color:var(--ok)}
.card{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 12px 46px;margin-top:10px}
.card.checked{background:var(--surface2)}
.card.checked .nm{text-decoration:line-through;text-decoration-thickness:1px}
.card .tm{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.card .nm{display:block;font-weight:900;font-size:17px}
.card .jp{display:block;color:var(--muted);font-size:12px}
.card p{margin:6px 0 0;font-size:14px}
.tip{color:var(--warn);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--muted);align-items:center}
.meta .pr{font-family:var(--mono);color:var(--ink)}
.meta a{color:var(--accent);font-weight:700}
.done{position:absolute;right:10px;bottom:8px;display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;cursor:pointer;min-height:32px}
.done input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.move{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.move b{display:block;font-size:13px;color:var(--accent)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:600}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700}
.prog .tr{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--ok)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);min-width:0}
.item b{display:block;font-size:16px}.item small{color:var(--muted);display:block}
.item .pr{font-family:var(--mono);font-size:13px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px}td.r,th.r{text-align:right;font-family:var(--mono)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
ul.plain{margin:6px 0 0;padding-left:20px}ul.plain li{margin:4px 0}
.foot{font-size:12px;color:var(--muted);margin-top:18px}.foot a{color:var(--accent)}
.card .vb{position:absolute;right:10px;top:10px}
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.meta a.go{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:5px 10px;border-radius:8px;min-height:32px;line-height:22px}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px}
.wheelwrap{position:relative;width:min(340px,100%);aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid var(--red);z-index:2}
.spin{font:inherit;font-weight:900;font-size:17px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:12px 34px;min-height:48px;cursor:pointer}
.spin:disabled{opacity:.55;cursor:default}
.result{width:100%;max-width:520px}
.hist{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.tab,.chip{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <h1>우리가족 다카마쓰 여행</h1>
  <p class="sub">2027년 1월 9일(토)–12일(화) · 인천 출발 다카마쓰 입국 · 마쓰야마 출국 청주 도착 · 나오시마 · 마쓰야마 · 도고온천 료칸 (성인 4명)</p>

  <section class="panel" aria-label="경로">
    <h2>이동 경로</h2>
    <svg id="map" class="map" viewBox="0 0 400 230" role="img" aria-label="시코쿠 북부 경로 약도"></svg>
    <p class="legend">점선은 이동 경로입니다(2일차 나오시마 당일, 3일차 고속버스로 마쓰야마). 약도라 실제 지형과 거리는 다릅니다.</p>
  </section>

  <div class="warnbox" id="warn"></div>

  <div class="prog" id="prog"></div>

  <div class="nav" id="nav"><span>현위치에서 길찾기 방식</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>

  <p class="foot" id="foot"></p>
</div>

<script>

var DAYS=[
{id:"d1",tab:"1일차 1/9(토)",date:"1월 9일 토요일",title:"청주 → 인천 → 다카마쓰 · 호텔 체크인 · 뼈붙은 닭구이",stay:"다카마쓰 ① (JR 호텔 클레멘트)",items:[
 {t:"오전",k:"이동",nm:"청주 → 인천공항 리무진",jp:"清州 → 仁川空港",d:"4인 편도 리무진을 미리 예약하세요. 출국 2–3시간 전에 공항에 도착할 수 있는 시각으로 잡습니다.",tip:"귀국 후 청주공항에서 집까지 가는 교통도 미리 정해 두세요.",p:0,pn:"예산 15만원(4인·귀가 포함)",v:"chk",q:"Incheon International Airport"},
 {t:"오후",k:"항공",nm:"인천 → 다카마쓰 오후편",jp:"ICN → TAK",d:"문서 기준으로 인천 오후 출발편입니다. 이전에 확인한 후보는 진에어 LJ299(14:10 출발, 15:50 도착)입니다. 4인 항공권 예산은 160만원입니다.",tip:"운항일·요금·좌석은 미확정이라 출발 전에 재확인하세요. 도착 시각에 따라 아래 공항버스 시각이 정해집니다.",p:0,pn:"4인 항공권 예산 160만원(왕복)",v:"chk",q:"Takamatsu Airport"},
 {t:"도착 후",k:"이동",nm:"공항 리무진 → JR 다카마쓰역",jp:"高松空港 → 高松駅",d:"공항 리무진은 항공기 착륙 약 15분 뒤에 출발하고 JR 다카마쓰역까지 약 40분 걸립니다. 성인 ¥1,300, 어린이 반액입니다.",tip:"착륙이 늦어지면 출발도 늦어집니다. 현금과 IC카드를 쓸 수 있습니다.",p:1300,pn:"¥1,300",v:"ok",q:"Takamatsu Station"},
 {t:"17:30",k:"숙소",nm:"JR 호텔 클레멘트 다카마쓰 체크인 (2박)",jp:"JRホテルクレメント高松",d:"JR역과 고속버스터미널이 가깝고, 나오시마 페리 승선장까지 걸어갈 수 있으며, 공항 리무진이 정차합니다. 1/9 체크인, 1/11 체크아웃 2박이고 4인은 트윈 2실을 기준으로 합니다. 2순위는 역 앞의 JR 클레멘트 인 다카마쓰입니다.",tip:"짐 보관과 조식 포함 여부를 예약할 때 확인하세요. 2박 숙박비 예산은 60만원입니다.",p:0,pn:"2박 예산 60만원(4인)",v:"chk",q:"JR Hotel Clement Takamatsu"},
 {t:"18:30",k:"식당",nm:"잇카쿠 다카마쓰점 (뼈붙은 닭구이)",jp:"一鶴 高松店",d:"호네쓰키도리(뼈 붙은 닭다리 구이)로 도착 첫날 저녁을 드세요. 문서가 1/9 저녁으로 추천한 곳입니다.",tip:"맵기와 간을 확인하세요. 토요일 저녁은 붐빌 수 있으니 예약이나 대기 여부를 확인하세요.",p:2000,pn:"¥1,500–2,500 추정",v:"chk",q:"Ikkaku Takamatsu"}
]},
{id:"d2",tab:"2일차 1/10(일)",date:"1월 10일 일요일",title:"나오시마 미술관 섬 당일 · 지중미술관 마지막 기회",stay:"다카마쓰 ② (같은 호텔)",items:[
 {t:"07:15",k:"식당",nm:"메리켄야 다카마쓰역앞점 (간단한 아침)",jp:"めりけんや 高松駅前店",d:"역 바로 앞 사누키 우동과 튀김으로 페리 타기 전에 가볍게 드세요.",tip:"큰 짐은 호텔에 맡기고 나오시마에는 가볍게 가세요. 영업 시작 시각은 확인하세요.",p:700,pn:"¥500–1,000 추정",v:"chk",q:"Merikenya Takamatsu Station"},
 {t:"07:50",k:"이동",nm:"다카마쓰항 → 나오시마 미야노우라",jp:"高松港 → 宮浦港",d:"08:12 출발 카페리(약 50분, ¥680)로 09:02에 도착하는 것을 기본으로 합니다. 고속선(약 30분, ¥1,590)은 07:20과 09:20에 있습니다.",tip:"시각표가 자료마다 달라서 시코쿠기센 공식 시각표와 결항 공지로 확인하세요. 카페리와 고속선은 부두가 다릅니다. 왕복표는 가지고 계세요.",p:680,pn:"카페리 ¥680 / 고속선 ¥1,590",v:"chk",q:"Takamatsu Port Naoshima ferry"},
 {t:"09:10",k:"명소",nm:"빨간 호박 (쿠사마 야요이)",jp:"赤かぼちゃ",d:"미야노우라 항에 있는 대표 야외 작품입니다. 도착하자마자 사진을 찍고 지나가세요.",tip:"항 주변은 식당이 적습니다. 간식은 여기서 사 두세요.",p:0,pn:"무료",v:"est",q:"Naoshima Red Pumpkin Miyanoura"},
 {t:"09:30",k:"이동",nm:"마을버스 · 무료 셔틀로 지중미술관",jp:"宮浦港 → つつじ荘 → 地中美術館",d:"마을버스(성인 ¥100)로 츠츠지소까지 간 뒤 베네세 무료 셔틀로 지중미술관에 갑니다. 셔틀은 붐비는 날 20분 간격입니다.",tip:"버스 시각을 페리 도착에 맞춰 확인하세요. 걸으면 약 35분입니다.",p:100,pn:"¥100",v:"ok",q:"Chichu Art Museum"},
 {t:"10:15",k:"명소",nm:"지중미술관 (안도 다다오 · 모네)",jp:"地中美術館",d:"안도 다다오가 설계한 반지하 미술관으로 모네, 터렐, 데 마리아 작품을 봅니다. 10:00–17:00(입장 마감 16:00), 일요일 온라인 요금 ¥2,700(현장 ¥3,000)이며 15세 이하는 무료입니다.",tip:"날짜와 시간을 지정한 입장권 4매를 먼저 예약하고 이우환·베네세 순서를 정하세요. 온라인이 매진되면 당일 현장 판매도 없습니다. 1월 12일(화)부터 3월 19일(금)까지 휴관하므로 오늘이 이번 겨울의 마지막 기회입니다.",p:2700,pn:"일요일 온라인 ¥2,700",v:"ok",q:"Chichu Art Museum"},
 {t:"12:00",k:"명소",nm:"이우환 미술관",jp:"李禹煥美術館",d:"지중미술관에서 가까운 안도 설계의 미술관. 이우환의 작품과 공간이 어우러집니다. 1시간이면 충분합니다.",tip:"1월 12–18일 휴관이라 오늘은 열려 있습니다. 입장료는 현장 안내로 확인하세요.",p:1200,pn:"약 ¥1,200 추정",v:"est",q:"Lee Ufan Museum Naoshima"},
